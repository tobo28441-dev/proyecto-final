<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unidad II · Formularios avanzados</title>

    <!-- Font Awesome 6 -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

    <!-- Estilos CSS personalizados -->
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- Formulario de inicio de sesión -->
    <form id="loginForm" novalidate>

        <h2>Iniciar Sesión</h2>

        <!-- Correo electrónico -->
        <div class="form_group">

            <label for="loginEmail">
                Correo electrónico:
            </label>

            <input
                type="email"
                id="loginEmail"
                name="loginEmail"
                required
                placeholder="correo@unicaribe.edu.co"
            >

            <span
                class="error-message"
                id="emailError">
            </span>

        </div>

        <!-- Contraseña -->
        <div class="form_group">

            <label for="loginPassword">
                Contraseña:
            </label>

            <input
                type="password"
                id="loginPassword"
                name="loginPassword"
                required
                minlength="6"
                placeholder="••••••"
            >

            <span
                class="error-message"
                id="passwordError">
            </span>

        </div>

        <!-- Botón -->
        <button
            type="submit"
            class="btn-primary">
            Iniciar Sesión
        </button>

    </form>

    <!-- JavaScript -->
    <script src="login.js"></script>

</body>

</html>
